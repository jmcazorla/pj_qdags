# Construye la wikidata completa (wikidata-enumerated.dat) en los seis backends: bv64, v5, v, sd,
# rrr y rrr15, cada uno en <OUT>/<backend>/. Lee el archivo de tripletas UNA sola vez. Usa --grid_side 296008193.
#
# Si ya tienes el dataset bv64 construido, es mas barato convertirlo: ver build_dataset_wiki_convert.conf.
# Para la wiki filtrada: build_dataset_wiki_filtered.conf.
#
# Cada backend terminado deja <OUT>/build_<backend>.done y la siguiente corrida lo salta (FORCE=true
# para rehacerlo). La salida de cada corrida queda en <OUT>/build_dataset.log.
#
# ./scripts/build_dataset_variants.sh scripts/confs/wiki/build_dataset_wiki.conf

MODE="triples"
INPUT="/path/to/wikidata-enumerated.dat"
OUT="/path/to/out/variants_wiki"

VARIANTS="all"                   # all, o una lista: "sd rrr rrr15"
GRID_SIDE=296008193              # wiki completa. DEBE coincidir con el GRID_SIDE de las corridas que lean este dataset
ONLY_SO=false                    # true = solo la relacion SO (sin proyecciones S y O)
FORCE=false

MEMLIMIT_KB=0                    # ulimit -v, 0 = sin tope
